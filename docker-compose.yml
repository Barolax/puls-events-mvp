version: '3.8'

services:

  # ── Base vectorielle ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  # ── Cache mémoire conversationnelle ──────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  # ── API FastAPI ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: puls-events-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      - redis
    restart: always
    volumes:
      - ./puls_events.db:/app/puls_events.db
    
  # ── Ingestion initiale ────────────────────────────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: puls-events-ingestion
    command: python ingestion/vectorizer.py
    env_file:
      - .env
    depends_on:
      - qdrant
    restart: "no"

  # ── Frontend Chainlit ─────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: puls-events-frontend
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - api
    restart: always

  # ── Monitoring Prometheus ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  # ── Visualisation Grafana ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_storage:/var/lib/grafana
    restart: always

volumes:
  qdrant_storage:
  grafana_storage: